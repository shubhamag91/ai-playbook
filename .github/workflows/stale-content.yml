name: Check Stale Content

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday 6am UTC
  workflow_dispatch:

jobs:
  stale-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check lastUpdated dates
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const glob = require('glob');

            const docsDir = 'src/content/docs';
            const files = glob.sync(`${docsDir}/**/*.{md,mdx}`);
            const stalePages = [];
            const now = new Date();
            const warningDays = 90;
            const criticalDays = 180;

            for (const file of files) {
              const content = fs.readFileSync(file, 'utf8');
              const match = content.match(/lastUpdated:\s*(\d{4}-\d{2}-\d{2})/);
              if (!match) {
                stalePages.push({ file, days: -1, status: 'missing' });
                continue;
              }
              const updated = new Date(match[1]);
              const daysSinceUpdate = Math.floor((now - updated) / (1000 * 60 * 60 * 24));
              if (daysSinceUpdate > warningDays) {
                stalePages.push({
                  file: file.replace(docsDir + '/', ''),
                  days: daysSinceUpdate,
                  status: daysSinceUpdate > criticalDays ? 'critical' : 'warning',
                  updated: match[1],
                });
              }
            }

            if (stalePages.length === 0) {
              console.log('No stale content found. All pages updated within ' + warningDays + ' days.');
              return;
            }

            let body = '## Stale Content Report\n\n';
            body += `Generated: ${now.toISOString().slice(0, 10)}\n\n`;

            const critical = stalePages.filter(p => p.status === 'critical');
            const warning = stalePages.filter(p => p.status === 'warning');
            const missing = stalePages.filter(p => p.status === 'missing');

            if (critical.length > 0) {
              body += '### 🔴 Critical (>180 days since update)\n\n';
              body += '| Page | Last Updated | Days Ago |\n|---|---|---|\n';
              for (const p of critical) {
                body += `| ${p.file} | ${p.updated} | ${p.days} |\n`;
              }
              body += '\n';
            }

            if (warning.length > 0) {
              body += '### 🟡 Warning (>90 days since update)\n\n';
              body += '| Page | Last Updated | Days Ago |\n|---|---|---|\n';
              for (const p of warning) {
                body += `| ${p.file} | ${p.updated} | ${p.days} |\n`;
              }
              body += '\n';
            }

            if (missing.length > 0) {
              body += '### ⚪ Missing lastUpdated\n\n';
              for (const p of missing) {
                body += `- ${p.file}\n`;
              }
              body += '\n';
            }

            body += '---\n_Generated by stale content checker workflow_';

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '📋 Stale content report - ' + now.toISOString().slice(0, 10),
              body: body,
              labels: ['maintenance', 'automated'],
            });
