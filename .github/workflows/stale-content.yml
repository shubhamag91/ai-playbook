name: Check Stale Content

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday 6am UTC
  workflow_dispatch:

permissions:
  issues: write

jobs:
  stale-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure labels exist
        uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              { name: 'maintenance', color: '0075ca', description: 'Maintenance tasks' },
              { name: 'automated', color: 'e4e669', description: 'Created by automated workflow' },
            ];
            for (const label of labels) {
              try {
                await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, ...label });
              } catch (e) {
                if (e.status !== 422) throw e; // 422 = already exists, ignore
              }
            }

      - name: Check nextVerificationDue dates
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            function walkDocs(dir) {
              const results = [];
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) results.push(...walkDocs(full));
                else if (/\.(md|mdx)$/.test(entry.name)) results.push(full);
              }
              return results;
            }

            const docsDir = 'src/content/docs';
            const files = walkDocs(docsDir);
            const overduePages = [];
            const now = new Date();

            for (const file of files) {
              const content = fs.readFileSync(file, 'utf8');

              // Check nextVerificationDue first (most precise)
              let match = content.match(/nextVerificationDue:\s*(\d{4}-\d{2}-\d{2})/);
              if (match) {
                const dueDate = new Date(match[1]);
                const daysOverdue = Math.floor((now - dueDate) / (1000 * 60 * 60 * 24));
                if (daysOverdue > 0) {
                  overduePages.push({
                    file: file.replace(docsDir + '/', ''),
                    days: daysOverdue,
                    status: daysOverdue > 90 ? 'critical' : 'warning',
                    dueDate: match[1],
                    reason: 'Past verification due date',
                  });
                }
                continue;
              }

              // Fallback: check lastUpdated
              match = content.match(/lastUpdated:\s*(\d{4}-\d{2}-\d{2})/);
              if (!match) {
                overduePages.push({ file: file.replace(docsDir + '/', ''), days: -1, status: 'missing', reason: 'Missing dates' });
                continue;
              }
              const updated = new Date(match[1]);
              const daysSinceUpdate = Math.floor((now - updated) / (1000 * 60 * 60 * 24));
              if (daysSinceUpdate > 180) {
                overduePages.push({
                  file: file.replace(docsDir + '/', ''),
                  days: daysSinceUpdate,
                  status: 'critical',
                  dueDate: match[1],
                  reason: 'lastUpdated >180 days ago',
                });
              }
            }

            if (overduePages.length === 0) {
              console.log('No overdue content found. All pages are current.');
              return;
            }

            let body = '## Content Verification Report\n\n';
            body += `Generated: ${now.toISOString().slice(0, 10)}\n\n`;

            const critical = overduePages.filter(p => p.status === 'critical');
            const warning = overduePages.filter(p => p.status === 'warning');
            const missing = overduePages.filter(p => p.status === 'missing');

            if (critical.length > 0) {
              body += '### 🔴 Overdue (>90 days past due date)\n\n';
              body += '| Page | Due Date | Days Overdue |\n|---|---|---|\n';
              for (const p of critical) {
                body += `| ${p.file} | ${p.dueDate} | ${p.days} |\n`;
              }
              body += '\n';
            }

            if (warning.length > 0) {
              body += '### 🟡 Due for Verification\n\n';
              body += '| Page | Due Date | Days Overdue |\n|---|---|---|\n';
              for (const p of warning) {
                body += `| ${p.file} | ${p.dueDate} | ${p.days} |\n`;
              }
              body += '\n';
            }

            if (missing.length > 0) {
              body += '### ⚪ Missing Verification Dates\n\n';
              for (const p of missing) {
                body += `- ${p.file}\n`;
              }
              body += '\n';
            }

            body += '---\n_Generated by content verification workflow_';

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '📋 Content verification report - ' + now.toISOString().slice(0, 10),
              body: body,
              labels: ['maintenance', 'automated'],
            });
