name: Check Links

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday 6am UTC
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore lychee cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Install lychee
        run: |
          curl -sL https://github.com/lycheeverse/lychee/releases/download/lychee-v0.23.0/lychee-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz -C /tmp/
          sudo mv /tmp/lychee /usr/local/bin/lychee

      - name: Check all links
        id: lychee
        run: |
          set +e
          lychee --config .github/lychee.toml --cache --format json --output link-check-report.json \
            README.md src/content/docs/
          LYCHEE_EXIT=$?
          set -e
          echo "lychee exit code: $LYCHEE_EXIT"
          ls -la link-check-report.json 2>/dev/null || echo "WARNING: link-check-report.json not created"
          echo "exit_code=$LYCHEE_EXIT" >> $GITHUB_OUTPUT

      - name: Ensure labels exist
        if: steps.lychee.outputs.exit_code != 0
        uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              { name: 'maintenance', color: '0075ca', description: 'Maintenance tasks' },
              { name: 'automated', color: 'e4e669', description: 'Created by automated workflow' },
            ];
            for (const label of labels) {
              try {
                await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, ...label });
              } catch (e) {
                if (e.status !== 422) throw e;
              }
            }

      - name: Create issue on broken links
        if: steps.lychee.outputs.exit_code != 0
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const raw = JSON.parse(fs.readFileSync('link-check-report.json', 'utf8'));
            const failMap = raw.fail_map || {};
            const rows = [];
            for (const [file, links] of Object.entries(failMap)) {
              for (const link of Array.isArray(links) ? links : []) {
                const url = typeof link === 'string' ? link : (link.url || JSON.stringify(link));
                const status = link.status ? JSON.stringify(link.status).slice(0, 80) : '';
                rows.push(`| \`${file}\` | ${url} | ${status} |`);
              }
            }
            const fileCount = Object.keys(failMap).length;
            let body = `## Broken Links Detected\n\n`;
            body += `**${rows.length} broken link(s) across ${fileCount} file(s)**\n\n`;
            if (rows.length > 0) {
              body += `| File | URL | Status |\n|---|---|---|\n`;
              body += rows.join('\n');
            }
            body += `\n\n---\n_Generated by link checker workflow_`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔗 Broken link report - ' + new Date().toISOString().slice(0, 10),
              body,
              labels: ['maintenance', 'automated']
            });
