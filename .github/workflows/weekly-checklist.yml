name: Weekly Maintenance Checklist

on:
  schedule:
    - cron: '0 7 * * 1'  # Every Monday 7am UTC
  workflow_dispatch:

jobs:
  create-checklist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure labels exist
        uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              { name: 'maintenance', color: '0075ca', description: 'Maintenance tasks' },
              { name: 'automated', color: 'e4e669', description: 'Created by automated workflow' },
            ];
            for (const label of labels) {
              try {
                await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, ...label });
              } catch (e) {
                if (e.status !== 422) throw e;
              }
            }

      - name: Check model pricing pages
        id: pricing
        shell: bash
        run: |
          echo "Checking pricing pages..."
          # Anthropic pricing
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://docs.anthropic.com/en/docs/about-claude/pricing 2>/dev/null || echo "failed")
          echo "anthropic=$STATUS" >> $GITHUB_OUTPUT

          # OpenAI pricing
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://openai.com/api/pricing/ 2>/dev/null || echo "failed")
          echo "openai=$STATUS" >> $GITHUB_OUTPUT

          # Compare with stored prices in models guide
          echo "model_specs_hash=$(md5sum src/content/docs/decide/models/guide.mdx | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - uses: actions/github-script@v7
        with:
          script: |
            const now = new Date();
            const dateStr = now.toISOString().slice(0, 10);
            const weekNum = Math.ceil(now.getDate() / 7);

            let body = `## Weekly Maintenance Checklist\n\n`;
            body += `**Date:** ${dateStr}  \n`;
            body += `**Estimated time:** 30-45 minutes\n\n`;
            body += `---\n\n`;

            body += `### 🔍 Content Review\n`;
            body += `- [ ] Check [What's New](/research/whats-new) — any major releases this week?\n`;
            body += `- [ ] Review [What's New](/research/whats-new) for new entries\n`;
            body += `- [ ] Scan [Emerging Trends](/research/emerging-trends) for shifts\n`;
            body += `- [ ] Verify Claude pricing on [docs.anthropic.com](https://docs.anthropic.com/en/docs/about-claude/pricing)\n`;
            body += `- [ ] Verify OpenAI pricing on [openai.com/api/pricing](https://openai.com/api/pricing/)\n`;
            body += `- [ ] Verify DeepSeek pricing on [api-docs.deepseek.com](https://api-docs.deepseek.com/)\n\n`;

            body += `### 🔗 Links & Build\n`;
            body += `- [ ] Run link checker results (see separate issue if created)\n`;
            body += `- [ ] Review stale content report (see separate issue if created)\n`;
            body += `- [ ] Run \`npm run build\` locally to verify no errors\n\n`;

            body += `### 📊 Metrics\n`;
            body += `- Total pages: check dist/ after build\n`;
            body += `- Broken links: check link report\n`;
            body += `- Stale pages (>90 days): check stale content report\n\n`;

            if (weekNum % 4 === 0) {
              body += `### 📅 Quarterly Tasks (Every 4 Weeks)\n`;
              body += `- [ ] Full pricing audit across all pages\n`;
              body += `- [ ] Check for new model families from major providers\n`;
              body += `- [ ] Review glossary for new terms to add\n`;
              body += `- [ ] Update any "May 2026" dated references if month changed\n`;
              body += `- [ ] Verify all external links to arXiv papers still resolve\n\n`;
            }

            body += `---\n_Generated by weekly maintenance workflow_`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🧹 Weekly maintenance checklist - ${dateStr}`,
              body: body,
              labels: ['maintenance'],
            });
