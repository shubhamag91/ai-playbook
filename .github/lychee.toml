# lychee link checker configuration
# Valid options: https://lychee.cli.rs/usage/config/

# URLs to skip (regex patterns)
exclude = [
  'twitter\.com',
  'x\.com',
  'github\.com/your-handle',
  'your-playbook\.example\.com',
  'ai-playbook-9y9\.pages\.dev',
  'chrome://',
  'mailto:',
  'localhost',
]

# Max concurrent requests
max_concurrency = 8

# Cache valid links (avoids re-checking on each run)
cache = true
max_cache_age = '7d'

# Per-request timeout in seconds
timeout = 15

# Retry settings
retry_wait_time = 5
max_retries = 2

# Accept redirects as valid
accept = [200, 201, 204, 301, 302, 303, 307, 308]
