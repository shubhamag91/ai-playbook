# lychee link checker configuration

# Exclude patterns (URLs that are expected to be ephemeral or require auth)
exclude = [
  'https://twitter.com',
  'https://x.com',
  'https://github.com/your-handle/ai-playbook',
  'https://your-playbook.example.com',
  'chrome://',
  'mailto:',
]

# Only check these file types
include_paths = [
  'README.md',
  'src/content/docs/',
  '*.md',
  '*.mdx',
]

# Skip checking file:/// URLs
exclude_file_paths = []

# Max concurrency
max_concurrency = 8

# Cache valid links for 7 days
cache = true
max_cache_age = '7d'

# Timeout per request
timeout = 15

# Retry on failure
retry_wait_time = 5
max_retries = 2

# Accept these status codes as valid
accept = [200, 301, 302, 303, 307, 308]

# Skip checking anchor fragments (e.g., #section)
include_fragments = false
