<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="900" height="240" rx="16" fill="#0b1220"/>

  <!-- spine -->
  <line x1="60" y1="120" x2="840" y2="120" stroke="url(#grad)" stroke-width="4"/>

  <!-- phases -->
  <g filter="url(#shadow)">
    <g transform="translate(60,120)">
      <circle r="18" fill="#3b82f6"/>
      <text y="6" text-anchor="middle" font-weight="700" fill="white" font-size="16">1</text>
      <text y="56" text-anchor="middle" fill="white" font-size="14" font-weight="600">Framing</text>
      <text y="76" text-anchor="middle" fill="#94a3b8" font-size="11">Is this LLM-shaped?</text>
    </g>
    <g transform="translate(200,120)">
      <circle r="18" fill="#6366f1"/>
      <text y="6" text-anchor="middle" font-weight="700" fill="white" font-size="16">2</text>
      <text y="56" text-anchor="middle" fill="white" font-size="14" font-weight="600">Data</text>
      <text y="76" text-anchor="middle" fill="#94a3b8" font-size="11">Context + retrieval</text>
    </g>
    <g transform="translate(340,120)">
      <circle r="18" fill="#8b5cf6"/>
      <text y="6" text-anchor="middle" font-weight="700" fill="white" font-size="16">3</text>
      <text y="56" text-anchor="middle" fill="white" font-size="14" font-weight="600">Prototype</text>
      <text y="76" text-anchor="middle" fill="#94a3b8" font-size="11">Thin E2E slice</text>
    </g>
    <g transform="translate(480,120)">
      <circle r="18" fill="#a855f7"/>
      <text y="6" text-anchor="middle" font-weight="700" fill="white" font-size="16">4</text>
      <text y="56" text-anchor="middle" fill="white" font-size="14" font-weight="600">Evaluate</text>
      <text y="76" text-anchor="middle" fill="#94a3b8" font-size="11">Numbers, not vibes</text>
    </g>
    <g transform="translate(620,120)">
      <circle r="18" fill="#d946ef"/>
      <text y="6" text-anchor="middle" font-weight="700" fill="white" font-size="16">5</text>
      <text y="56" text-anchor="middle" fill="white" font-size="14" font-weight="600">Ship</text>
      <text y="76" text-anchor="middle" fill="#94a3b8" font-size="11">Guardrails + cost</text>
    </g>
    <g transform="translate(760,120)">
      <circle r="18" fill="#ec4899"/>
      <text y="6" text-anchor="middle" font-weight="700" fill="white" font-size="16">6</text>
      <text y="56" text-anchor="middle" fill="white" font-size="14" font-weight="600">Iterate</text>
      <text y="76" text-anchor="middle" fill="#94a3b8" font-size="11">Prompts, chunks, models</text>
    </g>
  </g>

  <text x="450" y="40" text-anchor="middle" fill="white" font-size="18" font-weight="700">LLM Project Lifecycle</text>
  <text x="450" y="60" text-anchor="middle" fill="#94a3b8" font-size="12">The six phases of shipping an LLM feature</text>
</svg>
